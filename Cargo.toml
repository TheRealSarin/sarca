[package]
name = "sarca"
version = "0.1.0"
edition = "2024"
publish = false
description = "Serialised Arbitrary Remote Control Autonomy: a self-hosted remote-control bus"
license = "MIT"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
