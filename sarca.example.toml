log_messages = true

[server]
tcp = "127.0.0.1:7878"
ws = "127.0.0.1:7879"
unix = "/run/sarca/sarca.sock"
unix_mode = 0o660

[limits]
max_frame_bytes = 16777216
max_queue_per_target = 1000
default_ttl_ms = 30000
max_ttl_ms = 3600000
max_attempts = 10
max_backoff_ms = 60000
handshake_timeout_ms = 5000
session_buffer = 1024
max_pending = 100000
max_pending_bytes = 268435456
max_pending_per_principal = 10000
max_pending_bytes_per_principal = 67108864
max_subscriptions_per_session = 256
max_subscriptions_per_principal = 4096
max_targets = 10000
max_targets_per_principal = 1000
max_target_bytes = 268435456
max_target_bytes_per_principal = 33554432
max_outbound_bytes = 1073741824
max_outbound_bytes_per_session = 67108864
offline_target_retention_ms = 3600000

[rate_limit]
per_second = 100
burst = 200

[[auth.tokens]]
name = "operator"
sha256 = "replace-with-output-of-sarca-hash-token-0000000000000000000000000"
caps = ["game.*"]
send = ["*"]

[[auth.tokens]]
name = "game-servers"
sha256 = "replace-with-output-of-sarca-hash-token-1111111111111111111111111"
register = ["game-*"]
groups = ["games"]

[[rules]]
when_down = "game-1"
route_to = ["game-2", "group:games"]
